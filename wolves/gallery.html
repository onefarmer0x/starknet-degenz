<!doctype html><meta charset="utf-8"><title>Wolves</title>
<body style="margin:0;background:#2b2350;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;font:14px sans-serif;color:#fff">
<script>
for (let n = 1; n <= 30; n++) document.body.insertAdjacentHTML('beforeend', `<div style="background:#3a2f63;text-align:center"><video src="${n}.webm" autoplay loop muted playsinline style="width:100%;height:170px;object-fit:contain" onerror="this.parentNode.remove()"></video>${n}</div>`);
</script>
