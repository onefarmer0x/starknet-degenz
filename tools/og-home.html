<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=DM+Mono:wght@500&family=Fredoka:wght@600&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: Fredoka, sans-serif; color: #15111c;
    background: radial-gradient(2px 2px at 8% 14%, #ffefb8 50%, transparent 52%), radial-gradient(2px 2px at 44% 9%, #ffefb8 50%, transparent 52%), radial-gradient(3px 3px at 58% 30%, #ffefb8 50%, transparent 52%), radial-gradient(2px 2px at 92% 8%, #ffefb8 50%, transparent 52%), radial-gradient(2px 2px at 30% 44%, #ffefb8 50%, transparent 52%), linear-gradient(#2b2350, #1a1433 85%); }
  .eyebrow { position: absolute; left: 64px; top: 54px; background: #fff6e3; border: 4px solid #15111c; border-radius: 12px; padding: 5px 16px; font-size: 22px; letter-spacing: 1.5px; text-transform: uppercase; box-shadow: 4px 4px 0 #15111c; transform: rotate(-2deg); }
  h1 { position: absolute; left: 56px; top: 108px; margin: 0; font: 400 206px/0.85 Bangers, Impact, sans-serif; letter-spacing: 4px; color: #ffd23f;
       -webkit-text-stroke: 6px #15111c; paint-order: stroke fill; text-shadow: 9px 9px 0 #15111c, 15px 15px 0 #e3262f; transform: rotate(-3deg); transform-origin: left; }
  .sub { position: absolute; left: 70px; top: 318px; font: 400 54px Bangers, Impact, sans-serif; letter-spacing: 3px; color: #fff; -webkit-text-stroke: 2px #15111c; paint-order: stroke fill; text-shadow: 4px 4px 0 #15111c; transform: rotate(-2deg); }
  .pitch { position: absolute; left: 70px; top: 398px; width: 470px; background: #fff6e3; border: 4px solid #15111c; border-radius: 16px; padding: 12px 18px; font-size: 27px; line-height: 1.25; box-shadow: 6px 6px 0 #15111c; transform: rotate(1deg); }
  .chad { position: absolute; right: 16px; bottom: 66px; width: 420px; }
  .peek { position: absolute; right: 405px; bottom: 76px; width: 160px; transform: rotate(-9deg); }
  .strip { position: absolute; left: -20px; right: -20px; bottom: 18px; background: #ffd23f; border-block: 4px solid #15111c; padding: 8px 0; transform: rotate(-1.2deg);
           font: 400 34px Bangers, Impact, sans-serif; letter-spacing: 2px; white-space: nowrap; overflow: hidden; }
  .strip span { margin-right: 28px; }
  .chain { position: absolute; right: 40px; top: 40px; background: #ff6a13; color: #fff; border: 4px solid #15111c; border-radius: 12px; padding: 4px 14px; font: 400 32px Bangers, Impact, sans-serif; letter-spacing: 2px; -webkit-text-stroke: 1px #15111c; box-shadow: 4px 4px 0 #15111c; transform: rotate(3deg); }
</style></head>
<body>
  <span class="eyebrow">Starknet's most feral wolf pack</span>
  <span class="chain">ON STARKNET</span>
  <h1>$DEGENZ</h1>
  <div class="sub">STARKNET DEGENZ</div>
  <div class="pitch">Community bought. Community burned. Live price, holders, chart and the bonfire.</div>
  <video class="peek" src="../wolves/1.webm" muted autoplay playsinline></video>
  <video class="chad" src="../wolves/4.webm" muted autoplay playsinline></video>
  <div class="strip"><span>NO SELL. ONLY BURN 🔥</span><span>KEEP THE FIRE BURNING 🔥</span><span>AWOOOOO 🔥</span><span>WAGMI 🔥</span><span>FEED THE FIRE 🔥</span></div>
</body></html>
